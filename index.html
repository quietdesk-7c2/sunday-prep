<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sunday Prep</title>
<meta name="description" content="Cook once on Sunday. Eat well all week.">
<meta name="theme-color" content="#14201B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sunday Prep">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314201B'/%3E%3Crect x='12' y='24' width='40' height='26' rx='4' fill='%23DCE2D9'/%3E%3Crect x='8' y='18' width='48' height='8' rx='3' fill='%23E4C35C'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14201B;
  --ink-2:#233028;
  --wall:#DCE2D9;
  --steel:#F6F8F5;
  --line:#C3CCC0;
  --line-soft:#D5DCD2;
  --muted:#64756B;
  --signal:#A8341F;
  --signal-ink:#7C2415;
  --signal-soft:#F3DED9;
  --tape:#E4C35C;
  --tape-ink:#3B2F0A;
  --ok:#3F6B4A;

  --display:'Barlow Condensed',ui-sans-serif,system-ui,sans-serif;
  --body:'Public Sans',ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;

  --r:3px;
  --pad:16px;
  --nav-h:64px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--wall);
  color:var(--ink);
  font-family:var(--body);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
  overscroll-behavior-y:none;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:inherit}
a{color:var(--signal-ink)}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- type ---------- */
.eyebrow{
  font-family:var(--mono);font-size:10px;font-weight:500;
  letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:.005em;margin:0;line-height:1.05}
h1{font-size:34px;text-transform:uppercase;letter-spacing:.02em}
h2{font-size:24px;text-transform:uppercase;letter-spacing:.03em}
h3{font-size:19px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- app frame ---------- */
.app{max-width:600px;margin:0 auto;min-height:100vh}
header.top{
  position:sticky;top:0;z-index:40;
  background:var(--ink);color:var(--wall);
  padding:calc(env(safe-area-inset-top) + 12px) var(--pad) 12px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.wordmark{display:flex;align-items:baseline;gap:8px}
.wordmark b{
  font-family:var(--display);font-weight:700;font-size:22px;
  text-transform:uppercase;letter-spacing:.06em;color:var(--wall);
}
.wordmark span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:#8FA396;text-transform:uppercase}
.icon-btn{
  width:38px;height:38px;display:grid;place-items:center;
  border:1px solid #35463C;border-radius:var(--r);color:var(--wall);
}
.icon-btn:active{background:#233028}

main{padding:var(--pad) var(--pad) 28px}
.view{display:none}
.view.on{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- bottom nav ---------- */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:var(--ink);
  display:grid;grid-template-columns:repeat(4,1fr);
  padding-bottom:env(safe-area-inset-bottom);
  border-top:1px solid #2C3B33;
}
nav.tabs button{
  height:var(--nav-h);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:5px;color:#7E9187;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
}
nav.tabs button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7}
nav.tabs button[aria-selected="true"]{color:var(--tape)}

/* ---------- shelf (signature) ---------- */
.shelf-wrap{margin:0 0 22px}
.shelf-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:10px;gap:12px}
.shelf{
  display:grid;grid-template-columns:repeat(5,1fr);gap:6px;
  padding:10px 10px 0;background:var(--ink);border-radius:var(--r) var(--r) 0 0;
}
.slot{
  position:relative;height:96px;border-radius:2px;
  display:flex;flex-direction:column;justify-content:flex-end;
  padding:7px 5px 8px;text-align:center;overflow:hidden;
  background:linear-gradient(180deg,#EFF2ED 0%,#DDE3DA 100%);
  border:1px solid #B7C0B3;border-bottom:3px solid #9FAC9C;
}
.slot.empty{background:none;border:1px dashed #3F5147;border-bottom:1px dashed #3F5147}
.slot.empty .slot-day{color:#6F8378}
.slot-tape{
  position:absolute;top:9px;left:-8px;right:-8px;height:15px;
  background:var(--tape);transform:rotate(-1.6deg);
  box-shadow:0 1px 0 rgba(0,0,0,.14);
}
.slot-day{
  font-family:var(--mono);font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--tape-ink);
  position:absolute;top:11px;left:0;right:0;z-index:2;
}
.slot.empty .slot-day{position:static;margin-bottom:auto;padding-top:4px}
.slot-name{
  font-family:var(--display);font-size:13px;font-weight:600;line-height:1.08;
  color:var(--ink);text-transform:uppercase;letter-spacing:.01em;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.slot.empty .slot-name{color:#5E7268;font-size:11px;font-family:var(--body);
  font-weight:400;text-transform:none;letter-spacing:0}
.shelf-board{height:9px;background:#0C1512;border-radius:0 0 var(--r) var(--r)}
.shelf-meta{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:9px;gap:10px;
}

/* ---------- cards ---------- */
.card{
  background:var(--steel);border:1px solid var(--line);border-radius:var(--r);
  padding:14px;margin-bottom:10px;position:relative;
  display:block;width:100%;text-align:left;
}
.card:active{background:#EEF2EC}
.card-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.card h3{margin-bottom:3px}
.card .sub{color:var(--muted);font-size:12.5px;line-height:1.45}
.chip-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.chip{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--line);padding:3px 6px;border-radius:2px;color:var(--muted);
  background:#fff;white-space:nowrap;
}
.chip.solid{background:var(--ink);color:var(--wall);border-color:var(--ink)}
.chip.mine{background:var(--tape);color:var(--tape-ink);border-color:#C9A83E}
.chip.hot{background:var(--signal-soft);color:var(--signal-ink);border-color:#E2C2BA}

/* stepper */
.stepper{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:var(--r);background:#fff;flex:0 0 auto}
.stepper button{width:34px;height:32px;display:grid;place-items:center;color:var(--ink);font-size:17px;line-height:1}
.stepper button:disabled{color:#B3BFB6}
.stepper .val{
  min-width:34px;text-align:center;font-family:var(--mono);font-size:13px;font-weight:500;
  border-left:1px solid var(--line-soft);border-right:1px solid var(--line-soft);height:32px;
  display:grid;place-items:center;
}

/* buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 15px;border-radius:var(--r);border:1px solid var(--ink);
  font-family:var(--mono);font-size:11px;letter-spacing:.11em;text-transform:uppercase;font-weight:500;
}
.btn.primary{background:var(--signal);border-color:var(--signal);color:#fff}
.btn.primary:active{background:var(--signal-ink)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:active{background:#CFD7CC}
.btn.dark{background:var(--ink);color:var(--wall)}
.btn.full{width:100%}
.btn.sm{padding:8px 11px;font-size:10px}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 0;min-width:120px}

/* filters */
.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;margin:0 calc(var(--pad) * -1);padding-left:var(--pad);padding-right:var(--pad);scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{
  flex:0 0 auto;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--line);padding:7px 11px;border-radius:var(--r);background:var(--steel);color:var(--muted);
}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--tape);border-color:var(--ink)}

.search{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--steel);font-size:15px;margin-bottom:10px;
}
.search::placeholder{color:#8B998F}

/* section headers */
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:24px 0 10px}
.sec:first-child{margin-top:0}
.rule{height:1px;background:var(--line);margin:20px 0}

/* ---------- detail sheet ---------- */
.sheet{
  position:fixed;inset:0;z-index:80;background:var(--wall);
  overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;
}
.sheet.on{display:block}
.sheet-top{
  position:sticky;top:0;z-index:5;background:var(--ink);color:var(--wall);
  padding:calc(env(safe-area-inset-top) + 10px) var(--pad) 10px;
  display:flex;align-items:center;gap:10px;
}
.sheet-top .t{
  font-family:var(--display);text-transform:uppercase;letter-spacing:.05em;
  font-size:16px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.sheet-body{padding:0 var(--pad) 40px;max-width:600px;margin:0 auto}

.hero{background:var(--ink);color:var(--wall);margin:0 calc(var(--pad) * -1) 0;padding:6px var(--pad) 26px;position:relative}
.hero .label{
  background:var(--tape);color:var(--tape-ink);display:inline-block;
  padding:5px 12px;transform:rotate(-1.2deg);margin-bottom:14px;
  font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;
  box-shadow:0 1px 0 rgba(0,0,0,.2);
}
.hero h1{color:var(--wall);font-size:32px;margin-bottom:8px}
.hero p{color:#A9BAAF;font-size:13.5px;margin:0;line-height:1.5}

.meta-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:var(--r);
  margin:-14px 0 20px;overflow:hidden;position:relative;z-index:2;
}
.meta-grid div{background:var(--steel);padding:10px 8px;text-align:center}
.meta-grid .k{font-family:var(--mono);font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:3px}
.meta-grid .v{font-family:var(--mono);font-size:14px;font-weight:500}

.block{margin-bottom:22px}
.block > h2{margin-bottom:10px;font-size:17px;letter-spacing:.06em}

ul.plain{list-style:none;margin:0;padding:0}
ul.plain li{padding:9px 0;border-bottom:1px solid var(--line-soft);display:flex;gap:10px;align-items:flex-start}
ul.plain li:last-child{border-bottom:0}
.ing-q{font-family:var(--mono);font-size:12.5px;font-weight:500;flex:0 0 76px;color:var(--signal-ink);padding-top:1px}
.ing-n{flex:1}
.ing-n small{display:block;color:var(--muted);font-size:11.5px}

ol.steps{list-style:none;margin:0;padding:0;counter-reset:s}
ol.steps li{
  counter-increment:s;padding:0 0 16px 34px;position:relative;line-height:1.55;
}
ol.steps li::before{
  content:counter(s,decimal-leading-zero);position:absolute;left:0;top:1px;
  font-family:var(--mono);font-size:11px;font-weight:700;color:var(--signal);
}
ol.steps li:last-child{padding-bottom:0}

.note{
  background:var(--steel);border:1px solid var(--line);border-left:3px solid var(--tape);
  border-radius:var(--r);padding:12px 13px;font-size:13.5px;line-height:1.55;
}
.note.work{border-left-color:var(--signal)}
.note b{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted);margin-bottom:5px;font-weight:500}

.app-list{display:flex;flex-wrap:wrap;gap:6px}
.app-list span{
  background:var(--steel);border:1px solid var(--line);border-radius:var(--r);
  padding:7px 10px;font-size:12.5px;
}

.link-row{display:flex;flex-direction:column;gap:7px}
.link-row a{
  display:flex;align-items:center;gap:10px;padding:12px 13px;text-decoration:none;
  background:var(--steel);border:1px solid var(--line);border-radius:var(--r);color:var(--ink);
}
.link-row a svg{width:17px;height:17px;stroke:var(--signal);fill:none;stroke-width:1.7;flex:0 0 auto}
.link-row .lt{flex:1;min-width:0}
.link-row .lt b{display:block;font-size:13.5px;font-weight:600}
.link-row .lt small{color:var(--muted);font-size:11.5px}

/* ---------- lists / shopping ---------- */
.aisle{margin-bottom:18px}
.aisle > h3{
  font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:2px;font-weight:500;
}
.check{display:flex;align-items:flex-start;gap:11px;padding:10px 2px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.check:last-child{border-bottom:0}
.check input{
  appearance:none;width:19px;height:19px;border:1.5px solid var(--muted);border-radius:2px;
  flex:0 0 auto;margin:1px 0 0;display:grid;place-items:center;background:#fff;
}
.check input:checked{background:var(--ink);border-color:var(--ink)}
.check input:checked::after{content:'';width:9px;height:5px;border-left:2px solid var(--tape);
  border-bottom:2px solid var(--tape);transform:rotate(-45deg) translate(1px,-1px)}
.check span{flex:1;font-size:14px;line-height:1.4}
.check input:checked + span{color:#93A198;text-decoration:line-through}
.check .qty{font-family:var(--mono);font-size:12px;color:var(--signal-ink);font-weight:500}

/* ---------- timeline ---------- */
.tl{position:relative;padding-left:22px}
.tl::before{content:'';position:absolute;left:5px;top:6px;bottom:10px;width:1px;background:var(--line)}
.tl-item{position:relative;padding-bottom:18px}
.tl-item::before{content:'';position:absolute;left:-21px;top:5px;width:11px;height:11px;
  border-radius:50%;background:var(--wall);border:2px solid var(--signal)}
.tl-item .when{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.tl-item .what{font-size:14px;line-height:1.5}

/* ---------- forms ---------- */
label.f{display:block;margin-bottom:14px}
label.f > span{
  display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted);margin-bottom:5px;font-weight:500;
}
label.f input,label.f textarea,label.f select{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--steel);font-size:15px;
}
label.f textarea{min-height:110px;resize:vertical;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{color:var(--muted);font-size:12px;margin:-8px 0 14px;line-height:1.45}

/* ---------- empty / toast ---------- */
.empty{
  text-align:center;padding:44px 20px;border:1px dashed var(--line);
  border-radius:var(--r);color:var(--muted);
}
.empty h3{color:var(--ink);margin-bottom:6px}
.empty p{margin:0 0 14px;font-size:13.5px}

.toast{
  position:fixed;left:50%;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(14px);z-index:120;
  background:var(--ink);color:var(--wall);padding:11px 17px;border-radius:var(--r);
  font-family:var(--mono);font-size:11px;letter-spacing:.06em;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  max-width:88vw;text-align:center;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:100;background:rgba(12,21,18,.62);display:none;
  align-items:flex-end;justify-content:center;padding:0}
.modal.on{display:flex}
.modal-in{
  background:var(--wall);width:100%;max-width:600px;border-radius:var(--r) var(--r) 0 0;
  padding:20px var(--pad) calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;
}
.modal-in h2{margin-bottom:8px}
.modal-in p{font-size:13.5px;line-height:1.55;color:var(--ink-2)}

.set-row{padding:14px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row b{display:block;font-size:14.5px;margin-bottom:3px}
.set-row p{margin:0 0 10px;font-size:12.5px;color:var(--muted)}

/* switch row */
.switch{
  display:flex;align-items:flex-start;gap:12px;padding:13px 14px;margin-bottom:12px;
  background:var(--steel);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;
}
.switch input{
  appearance:none;width:44px;height:26px;border-radius:14px;background:#C0CABD;
  flex:0 0 auto;position:relative;transition:background .16s;margin:1px 0 0;
}
.switch input::after{
  content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:#fff;transition:transform .16s;box-shadow:0 1px 2px rgba(0,0,0,.2);
}
.switch input:checked{background:var(--signal)}
.switch input:checked::after{transform:translateX(18px)}
.switch .sw-t b{display:block;font-size:14px;font-weight:600;margin-bottom:2px}
.switch .sw-t small{color:var(--muted);font-size:12px;line-height:1.45;display:block}

/* freezer */
.freezer{
  border:1px solid var(--line);border-radius:var(--r);background:var(--steel);
  padding:12px 13px;margin-bottom:12px;
}
.freezer > .eyebrow{margin-bottom:9px}
.fz-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line-soft)}
.fz-row:last-child{border-bottom:0}
.fz-row .fz-n{flex:1;font-size:13.5px;line-height:1.3}
.fz-row .fz-n small{display:block;color:var(--muted);font-size:11px}
.fz-row .fz-c{font-family:var(--mono);font-size:12px;color:var(--signal-ink);font-weight:500}
.fz-add{
  width:30px;height:30px;border:1px solid var(--line);border-radius:var(--r);
  background:#fff;display:grid;place-items:center;font-size:17px;line-height:1;flex:0 0 auto;
}
.fz-add:disabled{color:#B3BFB6}
.slot.frozen{background:linear-gradient(180deg,#E6EFF3 0%,#CFDDE4 100%);border-color:#A8BCC6;border-bottom-color:#8FA6B2}
.slot.frozen .slot-tape{background:#9DC4D6}
.slot.frozen .slot-day{color:#1B3A47}

.cont{
  display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;background:var(--ink);color:var(--tape);
  padding:3px 7px;border-radius:2px;margin-bottom:7px;
}

@media (min-width:520px){
  .slot{height:108px}
  h1{font-size:38px}
}
</style>
</head>
<body>
<div class="app">

<header class="top">
  <div class="wordmark">
    <b>Sunday Prep</b>
    <span id="weekTag">—</span>
  </div>
  <button class="icon-btn" id="btnSettings" aria-label="Settings">
    <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">

/* ================= storage ================= */
const KEY = 'sundayprep.v1';
const store = {
  async get(){
    try{
      if(window.storage && window.storage.get){
        const r = await window.storage.get(KEY, false);
        return r && r.value ? JSON.parse(r.value) : null;
      }
    }catch(e){}
    try{ const v = localStorage.getItem(KEY); return v ? JSON.parse(v) : null; }catch(e){ return null; }
  },
  async set(obj){
    const s = JSON.stringify(obj);
    try{
      if(window.storage && window.storage.set){ await window.storage.set(KEY, s, false); return; }
    }catch(e){}
    try{ localStorage.setItem(KEY, s); }catch(e){}
  }
};

let state = { anchor:null, counts:{}, pool:[], saved:[], mine:[], checked:{}, freezer:[], fromFreezer:{}, double:false };
const save = () => store.set(state);

/* ================= week logic ================= */
/* A menu week starts Saturday 11:00 AM local time. */
function menuAnchor(){
  const now = new Date();
  const back = (now.getDay() - 6 + 7) % 7;
  const a = new Date(now.getFullYear(), now.getMonth(), now.getDate() - back, 11, 0, 0, 0);
  if(a > now) a.setDate(a.getDate() - 7);
  return a;
}
const anchorKey = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

function mulberry32(a){ return function(){ a|=0;a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function seedFrom(str){ let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }

function allRecipes(){ return RECIPES.concat(state.mine); }
function byId(id){ return allRecipes().find(r => r.id === id); }

/* Pick 4 for the week, spread across cuisines, seeded so it's stable all week. */
/* Built-ins only. The GitHub Action that sends your Saturday push runs this exact
   same roll against this exact same list, so the notification always matches the app. */
function rollPool(key, extraSalt){
  const rand = mulberry32(seedFrom(key + (extraSalt||'')));
  const pool = RECIPES.slice();
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(rand()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  const out=[], seen=new Set();
  for(const r of pool){ if(out.length>=4) break; if(seen.has(r.cuisine)) continue; seen.add(r.cuisine); out.push(r.id); }
  for(const r of pool){ if(out.length>=4) break; if(!out.includes(r.id)) out.push(r.id); }
  return out;
}

const DAYS = ['Mon','Tue','Wed','Thu','Fri'];
function slots(){
  const s=[];
  for(const id of state.pool){ const n = state.counts[id]||0; for(let i=0;i<n;i++) s.push({id,frozen:false}); }
  for(const id of Object.keys(state.fromFreezer||{})){
    for(let i=0;i<state.fromFreezer[id];i++) s.push({id,frozen:true});
  }
  while(s.length<5) s.push(null);
  return s.slice(0,5);
}
/* what is actually sitting in the freezer, minus anything already pulled into this week */
function freezerAvailable(){
  const have={};
  for(const f of (state.freezer||[])) have[f.id]=(have[f.id]||0)+1;
  for(const id of Object.keys(state.fromFreezer||{})) if(have[id]) have[id]-=state.fromFreezer[id];
  return Object.keys(have).filter(id=>have[id]>0 && byId(id)).map(id=>({id,n:have[id]}));
}
/* freezer-friendly dishes get doubled; cream sauces do not */
function effectiveCount(id){
  const r=byId(id), n=state.counts[id]||0;
  return (state.double && r && r.freezes) ? n*2 : n;
}
const packed = () => slots().filter(Boolean).length;

/* ================= formatting ================= */
function fmtQ(n){
  if(n==null) return '';
  if(n>=10) return String(Math.round(n*2)/2).replace(/\.0$/,'');
  const whole=Math.floor(n+1e-9), frac=n-whole;
  const table=[[0,''],[0.25,'¼'],[1/3,'⅓'],[0.5,'½'],[2/3,'⅔'],[0.75,'¾'],[1,'']];
  let best=table[0], bd=Infinity;
  for(const t of table){ const d=Math.abs(frac-t[0]); if(d<bd){ bd=d; best=t; } }
  const w = whole + (best[0]===1?1:0);
  const f = best[0]===1?'':best[1];
  if(w===0 && !f) return fmtSmall(n);
  if(w===0) return f;
  return f ? w+' '+f : String(w);
}
function fmtSmall(n){ return n<0.1 ? '0' : String(Math.round(n*100)/100); }
const mins = m => m>=60 ? Math.floor(m/60)+'h '+(m%60?(m%60)+'m':'').trim() : m+'m';
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ================= shopping list ================= */
/* You cannot buy 1¾ bell peppers. Anything sold by the piece rounds up. */
const COUNTABLE = ['','clove','cloves','stalk','stalks','can','cans','jar','jars','slice','slices'];
function shopQty(v,u){
  if(COUNTABLE.indexOf(u)>-1){ return Math.max(1,Math.ceil(v-1e-9)) + (u?' '+u:''); }
  return fmtQ(v) + (u?' '+u:'');
}

function buildShopping(){
  const bag = {};
  const loose = {};
  for(const id of Object.keys(state.counts)){
    const n = effectiveCount(id);
    if(!n) continue;
    const r=byId(id); if(!r) continue;
    const sc = n / r.makes;
    for(const i of r.ing){
      if(i.q==null){ loose[i.n] = i.a; continue; }
      const k = i.n+'|'+i.u+'|'+i.a;
      bag[k] = (bag[k]||0) + i.q*sc;
    }
  }
  const groups = {};
  for(const [k,v] of Object.entries(bag)){
    const [n,u,a]=k.split('|');
    (groups[a] = groups[a]||[]).push({n, qty: shopQty(v,u)});
  }
  for(const [n,a] of Object.entries(loose)){
    (groups[a] = groups[a]||[]).push({n, qty:''});
  }
  return groups;
}

function showShopping(){
  if(packed()===0){ toast('Add a dish to the week first'); return; }
  const g = buildShopping();
  const body = AISLES.filter(([k])=>g[k]&&g[k].length).map(([k,label])=>`

  const dbl = state.double ? Object.keys(state.counts).filter(id=>{const r=byId(id);return r&&r.freezes;}).map(id=>byId(id).name) : [];
  const nodbl = state.double ? Object.keys(state.counts).filter(id=>{const r=byId(id);return r&&!r.freezes;}).map(id=>byId(id).name) : [];
  openModal(`

  `);

  document.getElementById('copyShop').onclick = ()=>{

/* ================= sunday plan ================= */
function showPlan(){
  if(packed()===0){ toast('Add a dish to the week first'); return; }
  const chosen = Object.keys(state.counts).filter(id=>state.counts[id]).map(byId).filter(Boolean);
  if(!chosen.length){ toast('Everything is from the freezer, nothing to cook'); return; }
  const usesOven = chosen.filter(r=>r.appliances.some(a=>/oven/i.test(a)));
  const usesGrain = chosen.filter(r=>r.ing.some(i=>/rice|pasta|penne|ziti|rigatoni|orzo|potato/i.test(i.n)));
  const stove = chosen.filter(r=>!usesOven.includes(r));

  const items=[];
  items.push({when:'First 10 minutes', what:'Pull every ingredient out onto the counter and read the steps once. '+(usesOven.length?'Turn the oven on now so it is up to temperature when you need it.':'Nothing needs the oven this week.')});
  usesOven.forEach((r,i)=>items.push({when:'Oven, round '+(i+1), what:`${r.name} — get it in and set a timer for ${r.cook} minutes. Do not stand there watching it.`}));
  if(usesGrain.length) items.push({when:'While the oven runs', what:'Start the rice, pasta or potatoes for '+usesGrain.map(r=>r.name).join(' and ')+'. Undercook pasta by two minutes; it keeps cooking every time you microwave it.'});
  stove.forEach(r=>items.push({when:'Stovetop', what:`${r.name} — about ${r.cook} minutes of active cooking.`}));
  items.push({when:'Cool down', what:'Everything sits uncovered for 20 to 30 minutes before lids go on. Warm food under a lid makes condensation, and condensation is what turns Thursday\'s lunch to mush.'});
  if(state.double) items.push({when:'Split the batch', what:'Half into this week\'s containers, half into freezer containers. Label the freezer ones with the dish and the date, and lay them flat until solid so they stack.'});
  items.push({when:'Pack and label', what:'Portion into '+packed()+' containers. Masking tape and a marker: dish name and the date. Sauces and anything crunchy go in separate cups.'});
  items.push({when:'Stack it', what:'Monday and Tuesday at the front of the fridge, Thursday and Friday at the back. If anything freezes well, the Friday container can go in the freezer and move to the fridge Wednesday night.'});

  const est = chosen.reduce((s,r)=>s+r.prep,0) + Math.max(...chosen.map(r=>r.cook)) + 30;

  openModal(`
    <div class="eyebrow">Rough estimate · about ${mins(est)} start to finish</div>
    <h2 style="margin-bottom:16px">Sunday plan</h2>
    <div class="tl">
      ${items.map(i=>`<div class="tl-item"><div class="when">${esc(i.when)}</div><div class="what">${esc(i.what)}</div></div>`).join('')}
    </div>
    <div class="btn-row" style="margin-top:8px">
      <button class="btn dark" id="copyPlan">Copy as text</button>
      <button class="btn ghost" data-close>Done</button>
    </div>
  `);
  document.getElementById('copyPlan').onclick=()=>{
    copy('SUNDAY PLAN (about '+mins(est)+')\n\n'+items.map(i=>i.when.toUpperCase()+'\n  '+i.what).join('\n\n'),'Plan copied');
  };
}

/* ================= share / import ================= */
function b64e(o){ return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64d(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; return JSON.parse(decodeURIComponent(escape(atob(s)))); }

function recipeText(r){
  const sc=1;
  return `${r.name.toUpperCase()}\n${r.cuisine} · ${mins(r.prep+r.cook)} · makes ${r.makes} lunches · keeps ${r.keeps} days\n\n`+
    `${r.blurb}\n\nYOU NEED\n${r.appliances.map(a=>'  '+a).join('\n')}\n\n`+
    `INGREDIENTS\n${r.ing.map(i=>'  '+(i.q==null?'':fmtQ(i.q)+(i.u?' '+i.u:'')+'  ')+i.n+(i.note?' ('+i.note+')':'')).join('\n')}\n\n`+
    `METHOD\n${r.steps.map((s,i)=>'  '+(i+1)+'. '+s).join('\n')}\n\n`+
    `PACKING IT\n  ${r.pack}\n\nAT WORK\n  ${r.work}\n`+
    (r.links&&r.links.length?`\nLINKS\n${r.links.map(l=>'  '+l.label+': '+l.url).join('\n')}\n`:'')+
    `\nSent from Sunday Prep`;
}

function shareLink(r){
  const base = location.origin + location.pathname;
  return base + '#r=' + b64e(stripped(r));
}
function stripped(r){ const c=JSON.parse(JSON.stringify(r)); delete c.mine; return c; }

function shareRecipe(){
  const r=byId(openId); if(!r) return;
  openModal(`
    <h2 style="margin-bottom:6px">Share ${esc(r.name)}</h2>
    <p style="margin-bottom:16px">A link opens the recipe in this app on their phone. Plain text works anywhere else.</p>
    <div class="btn-row">
      <button class="btn primary" id="shLink">Send a link</button>
      <button class="btn dark" id="shText">Copy as text</button>
    </div>
    <button class="btn ghost full" style="margin-top:8px" data-close>Cancel</button>
  `);
  document.getElementById('shLink').onclick=async()=>{
    const url=shareLink(r);
    if(navigator.share){
      try{ await navigator.share({title:r.name, text:r.name+' — from Sunday Prep', url}); closeModal(); return; }catch(e){ if(e && e.name==='AbortError') return; }
    }
    copy(url,'Link copied');
  };
  document.getElementById('shText').onclick=()=>copy(recipeText(r),'Recipe copied');
}

async function copy(text,msg){
  try{ await navigator.clipboard.writeText(text); toast(msg); closeModal(); }
  catch(e){
    const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast(msg); closeModal(); }catch(_){ toast('Could not copy'); }
    ta.remove();
  }
}

function checkImport(){
  const m = location.hash.match(/^#r=(.+)$/);
  if(!m) return;
  let r; try{ r=b64d(m[1]); }catch(e){ return; }
  if(!r || !r.name || !Array.isArray(r.ing)) return;
  history.replaceState(null,'',location.pathname);
  openModal(`
    <div class="eyebrow">Someone shared a recipe</div>
    <h2 style="margin-bottom:6px">${esc(r.name)}</h2>
    <p style="margin-bottom:16px">${esc(r.blurb||'')} — ${esc(r.cuisine||'Other')}, makes ${r.makes||5} lunches.</p>
    <div class="btn-row">
      <button class="btn primary" id="impYes">Add to my recipes</button>
      <button class="btn ghost" data-close>No thanks</button>
    </div>
  `);
  document.getElementById('impYes').onclick=()=>{
    r.id='mine-'+Date.now(); r.mine=true;
    r.effort=r.effort||'Easy'; r.keeps=r.keeps||4; r.reheat=r.reheat||'2 min';
    r.appliances=r.appliances||[]; r.steps=r.steps||[]; r.links=r.links||[];
    r.pack=r.pack||'—'; r.work=r.work||'—';
    state.mine.push(r); save(); closeModal(); renderAll(); toast('Added to My recipes'); go('saved');
  };
}

/* ================= add / edit ================= */
let editingId=null;

function parseIngLine(line){
  const m = line.trim().match(/^([\d./\s]+)?\s*(cups?|cup|tbsp|tsp|lb|lbs|oz|g|kg|cloves?|cans?|jars?|slices?|stalks?|pinch)?\s+(.*)$/i);
  if(!m) return {q:null,u:'',n:line.trim(),a:'pantry'};
  let q=null;
  if(m[1]){
    const parts=m[1].trim().split(/\s+/);
    q=parts.reduce((s,p)=>{ if(p.includes('/')){ const [a,b]=p.split('/').map(Number); return s+(b?a/b:0);} return s+(parseFloat(p)||0); },0);
    if(!q) q=null;
  }
  return {q, u:(m[2]||'').toLowerCase(), n:(m[3]||line).trim(), a:'pantry'};
}

function saveOwn(){
  const g=id=>document.getElementById(id).value.trim();
  const name=g('f-name');
  if(!name){ toast('Give it a name first'); document.getElementById('f-name').focus(); return; }
  const lines=id=>g(id).split('\n').map(s=>s.trim()).filter(Boolean);
  const ing=lines('f-ing').map(parseIngLine);
  if(!ing.length){ toast('Add at least one ingredient'); return; }

  const r={
    id: editingId || ('mine-'+Date.now()),
    mine:true,
    name, cuisine:g('f-cuisine')||'Other',
    blurb:g('f-blurb')||'Your own recipe.',
    effort:'Easy',
    prep:parseInt(g('f-prep'))||10, cook:parseInt(g('f-cook'))||20,
    makes:parseInt(g('f-makes'))||5,
    reheat:g('f-reheat')||'2 min',
    keeps:parseInt(g('f-keeps'))||4,
    freezes:false,
    appliances:lines('f-app'),
    ing, steps:lines('f-steps'),
    pack:g('f-pack')||'Nothing special.',
    work:g('f-work')||'Reheat until hot through.',
    notes:'',
    links: g('f-link') ? [{t:'article', label:'Your link', sub:g('f-link').replace(/^https?:\/\//,'').slice(0,44), url:g('f-link')}] : []
  };

  if(editingId){
    const i=state.mine.findIndex(x=>x.id===editingId);
    if(i>-1) state.mine[i]=r;
  } else state.mine.push(r);

  editingId=null;
  save(); clearForm(); renderAll(); toast('Recipe saved'); go('saved');
}

function clearForm(){
  ['f-name','f-blurb','f-app','f-ing','f-steps','f-pack','f-work','f-link','f-reheat'].forEach(i=>document.getElementById(i).value='');
  document.getElementById('f-makes').value=5;
  document.getElementById('f-prep').value=15;
  document.getElementById('f-cook').value=30;
  document.getElementById('f-keeps').value=4;
  document.getElementById('f-cuisine').value='American';
  document.getElementById('addTitle').textContent='New recipe';
  editingId=null;
}

function loadIntoForm(r){
  editingId=r.id;
  const s=(id,v)=>document.getElementById(id).value=v;
  s('f-name',r.name); s('f-cuisine',r.cuisine); s('f-makes',r.makes);
  s('f-prep',r.prep); s('f-cook',r.cook); s('f-reheat',r.reheat); s('f-keeps',r.keeps);
  s('f-blurb',r.blurb); s('f-app',r.appliances.join('\n'));
  s('f-ing', r.ing.map(i=>((i.q!=null?fmtQ(i.q)+' ':'')+(i.u?i.u+' ':'')+i.n)).join('\n'));
  s('f-steps',r.steps.join('\n')); s('f-pack',r.pack); s('f-work',r.work);
  s('f-link', r.links && r.links[0] ? r.links[0].url : '');
  document.getElementById('addTitle').textContent='Edit recipe';
}

/* ================= modal ================= */
function openModal(html){
  document.getElementById('modalIn').innerHTML=html;
  document.getElementById('modal').classList.add('on');
  document.body.style.overflow='hidden';
}
function closeModal(){
  document.getElementById('modal').classList.remove('on');
  if(!document.getElementById('sheet').classList.contains('on')) document.body.style.overflow='';
}

/* ================= saturday reminder ================= */
function icsFile(){
  const now=new Date();
  const pad=n=>String(n).padStart(2,'0');
  const stamp=d=>d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+pad(d.getUTCHours())+pad(d.getUTCMinutes())+'00Z';
  // next Saturday
  const d=new Date(now); d.setDate(d.getDate() + ((6-d.getDay()+7)%7 || 7));
  const dt=d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T110000';
  const url=location.origin+location.pathname;
  const ics=[
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Sunday Prep//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH',
    'BEGIN:VTIMEZONE','TZID:America/Chicago',
    'BEGIN:DAYLIGHT','TZOFFSETFROM:-0600','TZOFFSETTO:-0500','TZNAME:CDT','DTSTART:19700308T020000','RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=2SU','END:DAYLIGHT',
    'BEGIN:STANDARD','TZOFFSETFROM:-0500','TZOFFSETTO:-0600','TZNAME:CST','DTSTART:19701101T020000','RRULE:FREQ=YEARLY;BYMONTH=11;BYDAY=1SU','END:STANDARD',
    'END:VTIMEZONE',
    'BEGIN:VEVENT',
    'UID:sundayprep-weekly-menu@'+(location.hostname||'local'),
    'DTSTAMP:'+stamp(now),
    'DTSTART;TZID=America/Chicago:'+dt,
    'DURATION:PT15M',
    'RRULE:FREQ=WEEKLY;BYDAY=SA',
    'SUMMARY:This week\'s lunch menu is ready',
    'DESCRIPTION:Open Sunday Prep\\, pick your lunches\\, and build the shopping list before you head to the store.\\n\\n'+url,
    'URL:'+url,
    'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:This week\'s lunch menu is ready','TRIGGER:PT0M','END:VALARM',
    'END:VEVENT','END:VCALENDAR'
  ].join('\r\n');
  const blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='sunday-prep-saturday-menu.ics';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

async function ntfyPush(topic, title, body){
  const res = await fetch('https://ntfy.sh/'+encodeURIComponent(topic), {
    method:'POST',
    headers:{ 'Title':title, 'Click':location.origin+location.pathname, 'Tags':'fork_and_knife',
              'Actions':'view, Open Sunday Prep, '+location.origin+location.pathname },
    body: body
  });
  if(!res.ok) throw new Error('ntfy returned '+res.status);
}

  const topic = state.ntfy || '';
  openModal(`
    <h2 style="margin-bottom:14px">Settings</h2>

    <div class="set-row">
      <b>Saturday push, 11:00 AM</b>
      <p>Put your ntfy topic here, subscribe to the same topic in the ntfy app on your phone, then send a test. The GitHub Action in your repo publishes to this topic every Saturday at 11:00 Central.</p>

    </div>

      await ntfyPush(t, "This week's lunch menu is ready", 'Test push from Sunday Prep. If this reached your phone, the Saturday job will too.');

/* ================= nav ================= */
function go(tab){
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on', v.id==='v-'+tab));
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected', b.dataset.tab===tab));
  window.scrollTo(0,0);
}

function renderAll(){ renderWeek(); renderRecipes(); renderSaved(); }

/* ================= events ================= */
document.addEventListener('click', e=>{
  const t=e.target;

  const tabBtn = t.closest('nav.tabs button');
  if(tabBtn){ go(tabBtn.dataset.tab); return; }

  const tabGo = t.closest('[data-tab-go]');
  if(tabGo){ go(tabGo.dataset.tabGo); return; }

  const open = t.closest('[data-open]');
  if(open){ openRecipe(open.dataset.open); return; }

  const step = t.closest('.stepper[data-step] button');
  if(step){
    const id=step.closest('.stepper').dataset.step;
    const d=parseInt(step.dataset.d);
    const cur=state.counts[id]||0;
    const next=Math.max(0, cur+d);
    if(d>0 && packed()>=5) { toast('The week is full'); return; }
    state.counts[id]=next;
    if(!next) delete state.counts[id];
    save(); renderWeek(); return;
  }

  const sstep = t.closest('#servStep button');
  if(sstep){ openServ=Math.min(10,Math.max(1,openServ+parseInt(sstep.dataset.d))); paintSheet(); return; }

  const thaw = t.closest('[data-thaw]');
  if(thaw){
    if(packed()>=5){ toast('The week is full'); return; }
    const id=thaw.dataset.thaw;
    state.fromFreezer[id]=(state.fromFreezer[id]||0)+1;
    save(); renderWeek(); toast('Pulled from the freezer'); return;
  }

  const chk = t.closest('[data-chk]');
  if(chk){ state.checked[chk.dataset.chk]=chk.checked; save(); return; }

  if(t.id==='dblChk'){ state.double=t.checked; save(); renderWeek(); return; }

  const cf = t.closest('#cuisineFilters button');
  if(cf){ filterCuisine=cf.dataset.c; renderRecipes(); return; }

  if(t.closest('[data-close]')){ closeModal(); return; }
  if(t.id==='modal'){ closeModal(); return; }

  switch(t.closest('button')?.id){
    case 'btnBack': closeRecipe(); break;
    case 'btnSettings': showSettings(); break;
    case 'btnShop': showShopping(); break;
    case 'btnPlan': showPlan(); break;
    case 'btnShuffle': {
      state.pool = rollPool(state.anchor, '\u00b7'+Date.now());
      state.counts={}; save(); renderWeek(); toast('Fresh picks');
      break;
    }
    case 'btnClearWeek': state.counts={}; state.fromFreezer={}; save(); renderWeek(); break;
    case 'btnStash': {
      let added=0;
      for(const id of Object.keys(state.counts)){
        const r=byId(id); if(!r || !r.freezes) continue;
        for(let i=0;i<state.counts[id];i++){ state.freezer.push({id, added:Date.now()}); added++; }
      }
      if(!added){ toast('Nothing in this week freezes'); break; }
      state.double=false;
      save(); renderWeek(); toast(added+' stashed in the freezer');
      break;
    }
    case 'btnFav': {
      const i=state.saved.indexOf(openId);
      if(i>-1){ state.saved.splice(i,1); toast('Removed from Saved'); }
      else { state.saved.push(openId); toast('Saved'); }
      save(); paintSheet(); renderRecipes(); renderSaved();
      break;
    }
    case 'btnAddWeek': {
      if(packed()>=5){ toast('The week is full'); break; }
      if(!state.pool.includes(openId)) state.pool.push(openId);
      state.counts[openId]=(state.counts[openId]||0)+1;
      save(); renderWeek(); toast('Added to this week');
      break;
    }
    case 'btnShare': shareRecipe(); break;
    case 'btnEditMine': { const r=byId(openId); closeRecipe(); loadIntoForm(r); go('add'); break; }
    case 'btnDelMine': {
      if(!confirm('Delete this recipe?')) break;
      state.mine=state.mine.filter(x=>x.id!==openId);
      state.saved=state.saved.filter(x=>x!==openId);
      delete state.counts[openId];
      state.pool=state.pool.filter(x=>x!==openId);
      delete state.fromFreezer[openId];
      state.freezer=state.freezer.filter(f=>f.id!==openId);
      save(); closeRecipe(); renderAll(); toast('Deleted');
      break;
    }
    case 'btnSaveRecipe': saveOwn(); break;
    case 'btnClearForm': clearForm(); toast('Cleared'); break;
  }
});

document.getElementById('searchBox').addEventListener('input', e=>{ query=e.target.value; renderRecipes(); });
document.addEventListener('keydown', e=>{
  if(e.key!=='Escape') return;
  if(document.getElementById('modal').classList.contains('on')) closeModal();
  else if(document.getElementById('sheet').classList.contains('on')) closeRecipe();
});

(function(){
  const icon = "data:image/svg+xml;utf8," + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" fill="#14201B"/><rect x="96" y="192" width="320" height="208" rx="24" fill="#DCE2D9"/><rect x="64" y="144" width="384" height="64" rx="16" fill="#E4C35C"/></svg>`);
  const m={name:'Sunday Prep',short_name:'Sunday Prep',start_url:'.',scope:'.',display:'standalone',
    background_color:'#DCE2D9',theme_color:'#14201B',
    icons:[{src:icon,sizes:'512x512',type:'image/svg+xml',purpose:'any maskable'}]};
  try{
    const l=document.createElement('link'); l.rel='manifest';
    l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));
    document.head.appendChild(l);
    const t=document.createElement('link'); t.rel='apple-touch-icon'; t.href=icon;
    document.head.appendChild(t);
  }catch(e){}

/* ================= boot ================= */
(async function boot(){
  const saved = await store.get();
  const key = anchorKey(menuAnchor());
  if(saved){
    state = Object.assign(state, saved);
    state.mine = state.mine || [];
    state.saved = state.saved || [];
    state.checked = state.checked || {};
    state.freezer = state.freezer || [];
    state.fromFreezer = state.fromFreezer || {};
    state.double = !!state.double;
  }
  if(state.anchor !== key){
    // New menu week. This is the Saturday 11:00 AM drop.
    state.anchor = key;
    state.pool = rollPool(key);
    state.counts = {};
    state.checked = {};
    state.fromFreezer = {};
    state.double = false;
    await save();
  }
  if(!state.pool || !state.pool.length){ state.pool = rollPool(key); }
  // Any of my own recipes that vanished from the pool reference
  state.pool = state.pool.filter(id => !!byId(id));
  while(state.pool.length < 4){
    const extra = rollPool(key, 'x'+state.pool.length).find(id=>!state.pool.includes(id));
    if(!extra) break; state.pool.push(extra);
  }
  renderAll();
  checkImport();
})();
</script>
