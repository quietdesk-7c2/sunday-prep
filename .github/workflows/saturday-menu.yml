name: Saturday menu push

on:
  schedule:
    # GitHub cron is UTC only and does not follow daylight saving, so we fire
    # twice and throw away whichever one is not 11:00 in Memphis.
    - cron: '0 16 * * 6'   # 11:00 CDT (summer)
    - cron: '0 17 * * 6'   # 11:00 CST (winter)
  workflow_dispatch:        # lets you fire one by hand from the Actions tab

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Only continue if it is 11 AM in Memphis
        id: gate
        run: |
          HOUR=$(TZ=America/Chicago date +%H)
          echo "Chicago hour is $HOUR"
          if [ "$HOUR" = "11" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Roll this week's picks
        if: steps.gate.outputs.run == 'yes'
        id: menu
        run: |
          cat > /tmp/picks.js <<'PICKS_SCRIPT'
          /* Rolls the same four picks the app will show, so the Saturday push matches
             what you see when you tap through. It reads index.html directly, which
             means adding or removing a recipe never desyncs the two. */
          const fs = require('fs');

          const src = fs.readFileSync('index.html', 'utf8');
          const re = /\n\s*id:'([^']+)', name:'([^']+)', cuisine:'([^']+)'/g;
          const R = [];
          let m;
          while ((m = re.exec(src))) R.push({ id: m[1], name: m[2], cuisine: m[3] });

          /* identical to the app */
          function mulberry32(a) {
            return function () {
              a |= 0; a = a + 0x6D2B79F5 | 0;
              let t = Math.imul(a ^ a >>> 15, 1 | a);
              t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
              return ((t ^ t >>> 14) >>> 0) / 4294967296;
            };
          }
          function seedFrom(str) {
            let h = 2166136261;
            for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
            return h >>> 0;
          }
          function rollPool(key) {
            const rand = mulberry32(seedFrom(key));
            const pool = R.slice();
            for (let i = pool.length - 1; i > 0; i--) {
              const j = Math.floor(rand() * (i + 1));
              [pool[i], pool[j]] = [pool[j], pool[i]];
            }
            const out = [], seen = new Set();
            for (const r of pool) { if (out.length >= 4) break; if (seen.has(r.cuisine)) continue; seen.add(r.cuisine); out.push(r); }
            for (const r of pool) { if (out.length >= 4) break; if (!out.includes(r)) out.push(r); }
            return out;
          }

          /* The app's week anchor is the most recent Saturday 11:00 in America/Chicago.
             Computed the same way here so a manual run on any day still matches the app. */
          function weekKey() {
            const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', {
              timeZone: 'America/Chicago', year: 'numeric', month: '2-digit',
              day: '2-digit', weekday: 'short', hour: '2-digit', hour12: false
            }).formatToParts(new Date()).map(x => [x.type, x.value]));
            const dow = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 }[p.weekday];
            let back = (dow - 6 + 7) % 7;
            if (dow === 6 && Number(p.hour) < 11) back = 7;
            const d = new Date(Date.UTC(+p.year, +p.month - 1, +p.day));
            d.setUTCDate(d.getUTCDate() - back);
            return d.toISOString().slice(0, 10);
          }
          const key = weekKey();

          let body;
          if (R.length < 4) {
            console.error('Only found ' + R.length + ' recipes in index.html, sending a generic push.');
            body = 'Open Sunday Prep to see this week\'s picks and build your shopping list.';
          } else {
            const picks = rollPool(key);
            console.log('Week ' + key + ': ' + picks.map(p => p.name).join(', '));
            body = picks.map(p => p.name + '  (' + p.cuisine + ')').join('\n') +
              '\n\nPick your five and build the shopping list before the store.';
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'body<<PICKS_EOF\n' + body + '\nPICKS_EOF\n');
          PICKS_SCRIPT
          node /tmp/picks.js

      - name: Push to ntfy
        if: steps.gate.outputs.run == 'yes'
        env:
          TOPIC: ${{ secrets.NTFY_TOPIC }}
          APP_URL: ${{ vars.APP_URL }}
          BODY: ${{ steps.menu.outputs.body }}
        run: |
          if [ -z "$TOPIC" ]; then echo "NTFY_TOPIC secret is not set."; exit 1; fi
          curl -sS --fail-with-body \
            -H "Title: This week's lunch menu is ready" \
            -H "Tags: fork_and_knife" \
            -H "Priority: default" \
            -H "Click: $APP_URL" \
            -H "Actions: view, Pick my lunches, $APP_URL" \
            -d "$BODY" \
            "https://ntfy.sh/$TOPIC"
